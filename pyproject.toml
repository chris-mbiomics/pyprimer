[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyprimer"
version = "2.0.0"
description = "Primer design for PCR, bisulphite PCR, real-time PCR and sequencing (Python port of PerlPrimer) with a web interface"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Christian Romberg", email = "christian.romberg@mbiomics.com" }]
keywords = ["primer design", "PCR", "qPCR", "bisulphite", "bioinformatics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Framework :: Flask",
]
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
server = ["waitress>=3.0"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
pyprimer = "pyprimer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyprimer = ["data/*", "web/templates/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/pyprimer"]

[[tool.mypy.overrides]]
module = ["waitress"]
ignore_missing_imports = true
